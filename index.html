<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Vulnerabilidades por Software</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark" aria-hidden="true">◆</span>
      <div>
        <h1>Painel de Vulnerabilidades por Software</h1>
        <p class="topbar__subtitle">Cadastre ativos e acompanhe CVEs conhecidos via NVD</p>
      </div>
    </div>
    <div class="topbar__actions">
      <button id="btn-api-key" class="btn btn--ghost" type="button" title="Configurar chave de API (opcional)">
        Chave de API
      </button>
      <button id="btn-novo-ativo" class="btn btn--primary" type="button">+ Novo ativo</button>
    </div>
  </header>

  <p id="status-conexao" class="status-conexao" hidden></p>

  <main class="layout">
    <section class="painel painel--ativos" aria-labelledby="titulo-ativos">
      <div class="painel__cabecalho">
        <h2 id="titulo-ativos">Ativos cadastrados</h2>
      </div>

      <div class="toolbar">
        <label class="campo">
          <span>Categoria</span>
          <input id="filtro-categoria" type="text" placeholder="ex.: servidor web" />
        </label>
        <label class="campo">
          <span>Ordenar por</span>
          <select id="filtro-ordenar">
            <option value="data">Data de cadastro</option>
            <option value="nome">Nome</option>
          </select>
        </label>
        <label class="campo">
          <span>Por página</span>
          <select id="filtro-page-size">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </label>
      </div>

      <div class="tabela-wrap">
        <table class="tabela">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Versão</th>
              <th>Categoria</th>
              <th>Cadastrado em</th>
              <th class="col-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <tr><td colspan="5" class="celula-vazia">Carregando ativos…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="paginacao">
        <button id="pagina-anterior" class="btn btn--ghost" type="button">← Anterior</button>
        <span id="pagina-info">Página 1</span>
        <button id="pagina-proxima" class="btn btn--ghost" type="button">Próxima →</button>
      </div>
    </section>

    <section class="painel painel--detalhe" aria-labelledby="titulo-detalhe">
      <div class="painel__cabecalho">
        <h2 id="titulo-detalhe">Vulnerabilidades</h2>
      </div>
      <div id="detalhe-conteudo" class="detalhe-conteudo">
        <p class="estado-vazio">Selecione um ativo na lista ao lado para consultar os CVEs relacionados na NVD.</p>
      </div>
    </section>
  </main>

  <div id="overlay" class="overlay" hidden>
    <form id="form-ativo" class="dialogo" novalidate>
      <h2 id="form-titulo">Novo ativo</h2>

      <label class="campo campo--bloco">
        <span>Nome do software</span>
        <input id="campo-nome" name="nome" type="text" placeholder="ex.: nginx" required />
      </label>

      <label class="campo campo--bloco">
        <span>Versão</span>
        <input id="campo-versao" name="versao" type="text" placeholder="ex.: 1.18" required />
      </label>

      <label class="campo campo--bloco">
        <span>Categoria</span>
        <input id="campo-categoria" name="categoria" type="text" placeholder="ex.: servidor web" required />
      </label>

      <p id="form-erro" class="form-erro" hidden></p>

      <div class="dialogo__acoes">
        <button type="button" id="btn-cancelar" class="btn btn--ghost">Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar</button>
      </div>
    </form>
  </div>

  <template id="template-badge-severidade">
    <span class="badge"></span>
  </template>

  <script src="assets/js/env.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
